<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>S</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>



:root {
 --primary:#FF0063;
 --white:#FFF;
 --grey:#000;
}
*{
margin:0;
padding:0;
box-sizing:border-box;
}

/* Quitar outlines de todos los elementos interactivos */
*,
*:focus,
*:active,
*:focus-visible,
*:focus-within,
*::before,
*::after {
 outline: none !important;
 -webkit-tap-highlight-color: transparent !important;
}

button,
button:focus,
button:active,
button:hover,
input,
input:focus,
input:active,
input:hover,
a,
a:focus,
a:active,
a:hover,
div:focus,
div:active,
.music,
.music:focus,
.music:active,
.list-btn,
.list-btn:focus,
.list-btn:active,
.progress-bar,
.progress-bar:focus,
.progress-bar:active,
i,
i:focus,
i:active {
 outline: none !important;
 box-shadow: none !important;
 -webkit-appearance: none !important;
 -webkit-tap-highlight-color: transparent !important;
}
body {
font-family: 'Open Sans', sans-serif;
font-size:1rem;
background:var(--white);
}
body.dark {
 --white:#000;
 --grey:#FFF;
 background:#000;
}
a,a:hover {
text-decoration:none;
}
img{
 max-width:100%;
}
p{
 color:var(--grey);
}
.sec {
 background:var(--white);
 width:100%;
 min-height:100%;
 max-width:100%;
 margin:auto;
 animation:fadeIn 0.5s ease;
}
@keyframes fadeIn{
 0%{
  opacity:0;
 }
 100%{
 opacity:1;
 }
}
button{
 display:inline-block;
 outline:none !important;
 border:none;
 background:transparent;
 -webkit-tap-highlight-color: transparent !important;
}

/* Reglas específicas para elementos del reproductor */
.players button,
.list-btn,
.back-btn,
.dark-mode-btn,
.prevBtn,
.nextBtn,
.play-pause-btn {
 outline: none !important;
 border: none !important;
 box-shadow: none !important;
 -webkit-tap-highlight-color: transparent !important;
}

/* Eliminar outlines de inputs de rango */
input[type="range"],
input[type="range"]:focus,
input[type="range"]:active,
.progress-bar,
.progress-bar:focus,
.progress-bar:active {
 outline: none !important;
 box-shadow: none !important;
}

/* Eliminar outlines de elementos de lista */
.music,
.music:focus,
.music:active,
.music:hover {
 outline: none !important;
}
.sec-1 {
 padding:20px;
 display:flex;
 justify-content: center;
 text-align: center;
 min-height:100vh;
}

.sec-1 svg {
 width:90%;
 height:20%;
}
.sec-1 h1 {
  font-size:2.5rem;
}
.sec-1 h1 > span {
 color: deeppink;
}
.sec-1 p {
 margin:10px 0 25px;
 color:#fff;
 font-size:14px;
}
.sec-1 button {
 padding:12px 25px;
 background: deeppink;
 color:#FFF;
 border-radius:25px;
}
.hide {
 display:none;
}
.header {
 margin:0 10px;
 padding:8px 10px;
 display:flex;
 justify-content:space-between;
 border-bottom:2px solid #ccc;
 color:var(--grey);
}
.header button {
 color:var(--white);
 padding:6px 10px;
 font-size:14px;
 cursor:pointer;
 background:#000;
 border-radius:30px;
}
.header button:hover {
 opacity:0.7;
}
body.dark .header button {
 background:#FFF;
}
.search-container {
 position: relative;
 margin: 10px;
 margin-bottom: 15px;
}

.search-container input {
 width: 100%;
 padding: 12px 45px 12px 15px;
 border: 2px solid #dedede;
 border-radius: 25px;
 font-size: 16px;
 background: var(--white);
 color: var(--grey);
 outline: none;
 transition: border-color 0.3s ease;
}

.search-container input:focus {
 border-color: var(--primary);
}

.search-container .search-icon {
 position: absolute;
 right: 15px;
 top: 50%;
 transform: translateY(-50%);
 color: #999;
 pointer-events: none;
}

body.dark .search-container input {
 background: var(--white);
 color: var(--grey);
 border-color: #444;
}

body.dark .search-container input:focus {
 border-color: var(--primary);
}

.music-list {
 padding-bottom:70px;
}

#no-results-message {
 background: var(--white);
 color: var(--grey);
 text-align: center;
 padding: 20px;
 font-style: italic;
 opacity: 0.7;
}

body.dark #no-results-message {
 background: var(--white);
 color: var(--grey);
}
.music {
 padding:10px 10px;
 display:flex;
 align-items: center;
 width:100%;
 border-bottom:1px solid #dedede;
 cursor:pointer;
 color:var(--grey);
}
.music.active {
 color:var(--primary);
}
.list-thumbnail {
 height:60px;
 width:60px;
 border-radius:4px;
 overflow:hidden;
}
.list-content {
 flex:1;
 padding:0 15px;
}
.list-btn {
 width:50px;
 height:50px;
}
.list-btn > i {
 font-size:40px;
 color:var(--grey);
}
.music.active .list-btn > i {
 display:none;
}
.music .equalize {
 display:none;
}
.music.active .equalize {
 display:block;
}
.music-list .equalize span {
 display:inline-block;
 height:18px;
 width:3px;
 margin:1px;
 background:var(--primary);
 animation:equalize 1s linear infinite;
 transform-origin: bottom;
}
 .equalize.pause span {
  animation-play-state:paused!important;
}
.equalize span:nth-child(2) {
 animation-delay:.3s;
} 
.equalize span:nth-child(3) {
 animation-delay:.6s;
} 
@keyframes equalize {
 0%, 100%{
  transform:scaleY(1);
 }
 50%{
  transform:scaleY(0.3);
 }
}

.players {
 position:fixed;
 width:100%;
 max-width:100%;
 left:0;
 bottom:0;
 z-index:5;
 background:var(--white);
 color:#555;
 transition:300ms;
}
.players.active {
 height:100vh;
 top:0;
 text-align:center;
 padding:0 20px;
 overflow-y:scroll;
 animation:fadeIn 0.5s ease;
 animation-fill-mode:both;
}
.bottom {
 display:flex;
 align-items: center;
 height:70px;
 padding:5px 10px;
 border-top:1px solid #CCC;
}
.players.active .bottom {
 display:block;
 border-top:none;
 height:auto;
 padding:0;
 margin-bottom:25px;
}
.thumbnail {
 height:60px;
 width:60px;
 overflow:hidden;
 border-radius:50%;
}
.players.active .thumbnail{
 width:220px;
 margin:40px auto;
 height:220px;
 border-radius:50%;
 background:#000;
 box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* Animación rotativa para mini reproductor */
.thumbnail.spin {
 animation:spin 4s linear infinite;
}
.thumbnail.spin:hover {
 animation-play-state:paused;
 transition:200ms;
}
.thumbnail.spin.pause {
 animation-play-state:paused;
}
/* Animación rotativa para reproductor en pantalla completa */
.players.active .thumbnail.spin {
 box-shadow: none;
 animation:spin 4s linear infinite;
}
.players.active .thumbnail.spin:hover {
 animation-play-state:paused;
 transition:200ms;
}
.players.active .thumbnail.spin.pause{
 animation-play-state:paused;
}
@keyframes spin {
 to{
 transform:rotate(360deg); 
 }
}
.thumbnail img {
 object-fit:cover;
}

.content {
 flex:1;
 padding:0 15px;
 color:var(--grey);
}
.btn-group .material-icons {
 font-size:40px;
}
.btn-group button {
 color:var(--primary);
 cursor:pointer;
 height:60px;
 width:60px;
 border-radius:50%;
 cursor:pointer;
}
.playBtn {
 z-index:6;
}

.back-btn {
 position:absolute;
 top:10px;
 left:10px;
 height:40px;
 width:40px;
 cursor:pointer;
 border-radius:20px;
}
.dark-mode-btn {
position:absolute;
 top:10px;
 right:10px;
 height:40px;
 width:40px;
 cursor:pointer;
 border-radius:20px;
}

.back-btn:hover {
 background:rgba(255,0,0,0.2);
}
.back-btn .material-icons {
  font-size:40px;
}
body.dark .players .material-icons {
 color:#FFF;
}
body.dark .players .material-icons.active  {
 color:var(--primary);
}
.prevBtn, .nextBtn, .tools , .progress-box, .back-btn, .dark-mode-btn {
 display:none;
}
.players.active .nextBtn,
.players.active .prevBtn,
.players.active .back-btn,
.players.active .dark-mode-btn {
 display:inline-block;
}
.players.active .progress-box,
.players.active .tools {
 display:flex;
}
.tools {
 width:100%;
 margin:30px 0;
 justify-content: space-evenly;
}
.tools .material-icons {
 font-size:30px;
 color:#555;
 cursor:pointer;
}
.tools .material-icons.active {
 color:var(--primary);
}
.players.active .playBtn {
 margin:0 25px;
 background:rgba(255,0,0,0.2);
 transition:0.3s;
}
.players.active .playBtn:hover {
 background:var(--primary);
 color:#fff;
}
.players.active .content h3{
 font-size:24px;
 color:var(--primary);
}
.progress-box {
 position:relative;
 margin-bottom:30px;
 display:none;
 width:100%;
 justify-content:space-between;
 font-size:14px;
}
.players.active .progress-box {
 display:flex;
}
.progress-bar {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    z-index: 4;
    height: 10px;
    background: linear-gradient(to right, var(--primary) 0%, var(--primary) 0%, #CCC 0%, #CCC 100%);
    width: 100%;
    border-radius: 30px;
    top:-10px;
}
.progress-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 15px;
    width: 15px;
    border: 0;
    background: var(--primary);
    border-radius:50%;
    cursor: pointer;
} 
  
.volume-box {
 display:none;
}
.players.active .volume-box {
 transform:translateY(15px);
 display: none;
}
.players.active .volume-box.show {
 display: block;
}

.volume-box .progress-bar {
 position:relative;
 width:60%;
}
.volume-box > span {
 display:inline-block;
 height:30px;
 width:30px;
 margin:0 5px;
 cursor:pointer;
 transition:200ms;
}
.volume-box > span:hover {
 color:var(--primary);
}
#audio {
 display:none;
}
</style>
</head>

     <div class="btn-group" >

       </button>
       <button class="playBtn"  onclick="playPause(event)">

       </button>
       <button class="nextBtn" onclick="nextPlay()">

       </button>
     </div>
   </div>
 </div>
</section>

let repeatMusic = false;
let index = 1;
let songs = musicData;

const elc = musicList.getElementsByClassName("equalize")[index-1];

const showMusicList = () => {
 document.querySelector(".sec-1").classList.add("hide");
 document.querySelector(".sec-2").classList.remove("hide");
}
const darkMood = () => {
 body.classList.toggle("dark");
}

const setActive = (i) => {
  setEqualizer()
  let a =  musicList.querySelector(".active");
  if(a !== null) {
   a.classList.remove("active");
  }
  const ele = document.getElementsByClassName("music")[i-1];
  ele.classList.add("active");
}

const setData = data => {
 name.textContent = data.name;
 category.textContent = data.category;
 thumbnail.src = data.image;
} 

const playMusic = async (i) => {
  if(i == 18 || i == 10 ) {
   body.classList.toggle("dark");
   setTimeout(() => body.classList.toggle("dark"),7000);
  }
  let data = musicData.find(m => m.id === i) || musicData[1];
  setActive(i)
  setData(data);
  playBtn.textContent = "pause";
  audio.src = data.src;
  await audio.load();
  audio.play();
  // Iniciar animación rotativa automáticamente
  document.querySelector(".thumbnail").classList.add("spin");
  setEqualizer();
}
 
 const playPause = e => {
    if(audio.paused) {
    playBtn.textContent = "pause";
    audio.play();
    // Iniciar animación rotativa al reproducir
    document.querySelector(".thumbnail").classList.add("spin");
    setEqualizer()
   } else{
   playBtn.textContent = "play_arrow";
    audio.pause();
    setEqualizer(true)
   }
 }
 
 const showplayer = () => {
   playerWindow.classList.toggle("active");
 }
 const equalizerBtn = e => {
  e.target.classList.toggle("active");
  document.querySelector(".thumbnail").classList.toggle("spin");
 }
 const addFvt = e => {
  e.target.classList.toggle("active")
 }
 const repeat = e => {
  e.target.classList.toggle("active")
  repeatMusic = !repeatMusic;
  audio.loop = repeatMusic;
 }
 const volumeBox = e => {
  e.target.classList.toggle("active");
  document.querySelector(".volume-box").classList.toggle("show");
 }
 const nextPlay = () => {
  index++;
  if (index > musicData.length) {
   index = 1;
  }
  playMusic(index);
 }
 const prevPlay = () => {
  index--;
  if (index <= 0) {
  index = musicData.length;
  }
  playMusic(index);
 }
 
 audio.addEventListener("ended", () => {
  nextPlay();
 })
 audio.onloadeddata = () =>  {
 progress.max = audio.duration
 const ds = parseInt(audio.duration % 60)
 const dm = parseInt((audio.duration / 60) % 60)
 ttview.textContent = dm + ':' + ds;
 // Inicializar gradiente de la barra de progreso al 0%
 progress.style.background = `linear-gradient(to right, var(--primary) 0%, var(--primary) 0%, #CCC 0%, #CCC 100%)`;
 }
 audio.ontimeupdate =  () =>  { 
   progress.value = audio.currentTime;
   // Actualizar gradiente de la barra de progreso
   if (audio.duration) {
     const percentage = (audio.currentTime / audio.duration) * 100;
     progress.style.background = `linear-gradient(to right, var(--primary) 0%, var(--primary) ${percentage}%, #CCC ${percentage}%, #CCC 100%)`;
   }
 }
 audio.addEventListener('timeupdate', () => {

 var cs = parseInt(audio.currentTime % 60)
 var cm = parseInt((audio.currentTime / 60) % 60)
  ctview.textContent = cm + ':' + cs;
 }, false);
 
 const changeProgressBar = () => { 
   audio.currentTime = progress.value;
   // Actualizar gradiente de la barra de progreso
   if (audio.duration) {
     const percentage = (progress.value / audio.duration) * 100;
     progress.style.background = `linear-gradient(to right, var(--primary) 0%, var(--primary) ${percentage}%, #CCC ${percentage}%, #CCC 100%)`;
   }
 }
 

 const addList = (data) => {
  let div = document.createElement("div");
  div.classList.add('music');
  div.setAttribute("data-id", data.id);
  let html = `
   <div class="list-thumbnail" >
    <img src="${data.image}" alt="" >
   </div>
   <div class="list-content" >
   <h3>${data.name}</h3>
   <small>${data.category}</small>
   </div>
   <button class="list-btn" >
   <i class="material-icons">play_arrow</i>
    <div class="equalize">
    <span></span>
    <span></span>
    <span></span>
   </div>
   </button>`;
   div.innerHTML = html;
   musicList.append(div);
   div.addEventListener('click', () => {
    playMusic(data.id);
    playerWindow.classList.add("active");
    index = data.id;
   });
 }
 
 const setMusicList =  () => {
  songs.forEach(song => addList(song));
 }

 // Función para filtrar canciones
 const filterSongs = (searchTerm) => {
   const musicElements = document.querySelectorAll('.music');
   let visibleCount = 0;
   
   musicElements.forEach(element => {
     const title = element.querySelector('.list-content h3').textContent.toLowerCase();
     const category = element.querySelector('.list-content small').textContent.toLowerCase();
     const searchTermLower = searchTerm.toLowerCase().trim();
     
     if (searchTermLower === '' || title.includes(searchTermLower) || category.includes(searchTermLower)) {
       element.style.display = 'flex';
       visibleCount++;
     } else {
       element.style.display = 'none';
     }
   });
   
   // Mostrar mensaje si no hay resultados
   let noResultsMsg = document.getElementById('no-results-message');
   if (visibleCount === 0 && searchTerm.trim() !== '') {
     if (!noResultsMsg) {
       noResultsMsg = document.createElement('div');
       noResultsMsg.id = 'no-results-message';
       noResultsMsg.innerHTML = '<p>No se encontraron canciones que coincidan con tu búsqueda</p>';
       musicList.appendChild(noResultsMsg);
     }
     noResultsMsg.style.display = 'block';
   } else {
     if (noResultsMsg) {
       noResultsMsg.style.display = 'none';
     }
   }
 }

 // Configurar el buscador
 const searchInput = document.getElementById('search-input');
 if (searchInput) {
   searchInput.addEventListener('input', (e) => {
     filterSongs(e.target.value);
   });
   
   // Limpiar búsqueda con Escape
   searchInput.addEventListener('keydown', (e) => {
     if (e.key === 'Escape') {
       searchInput.value = '';
       filterSongs('');
     }
   });
 }

 const filterCat = (cat) => {
  songs = musicData.filter(song => song.category == cat);
  while(musicList.hasChildNodes()){
    musicList.removeChild(musicList.firstChild);
  }
  setMusicList();
  // Limpiar búsqueda cuando se filtra por categoría

function setEqualizer(action = false){
 const elc = musicList.getElementsByClassName("equalize")[index-1];
 const thumb =  document.querySelector(".thumbnail");
 if(elc.classList.contains("pause")) {
   elc.classList.remove("pause")
 } else {
  if(action) {
   elc.classList.add("pause")
  }
 }
 // Manejar animación rotativa automáticamente
 if(!audio.paused && !thumb.classList.contains("spin")){
  // Si está reproduciéndose pero no tiene spin, agregarlo
  thumb.classList.add("spin");
 }
 if(thumb.classList.contains("spin") && audio.paused && action){
  thumb.classList.add("pause");
 } else if(thumb.classList.contains("spin") &&!audio.paused){
  thumb.classList.remove("pause");
 }
}
